name: Build Hifadhio Phase 3 APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Test APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Run Unit Tests
        run: |
          cd android
          ./gradlew testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release_records/phase_03_collections_library/v0.3.0/
          cp android/app/build/outputs/apk/debug/app-debug.apk release_records/phase_03_collections_library/v0.3.0/Hifadhio-v0.3.0-phase3-debug.apk
          cd release_records/phase_03_collections_library/v0.3.0/
          zip -9 Hifadhio-v0.3.0-phase3-debug.zip Hifadhio-v0.3.0-phase3-debug.apk
          sha256sum Hifadhio-v0.3.0-phase3-debug.apk > SHA256SUMS.txt
          sha256sum Hifadhio-v0.3.0-phase3-debug.zip >> SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ../../..

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hifadhio-v0.3.0-phase3-debug
          path: |
            release_records/phase_03_collections_library/v0.3.0/Hifadhio-v0.3.0-phase3-debug.apk
            release_records/phase_03_collections_library/v0.3.0/Hifadhio-v0.3.0-phase3-debug.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.0-phase3
          name: "Hifadhio v0.3.0 (Phase 3 Collections, Tags and Library)"
          body: |
            ## Hifadhio v0.3.0 — Phase 3 Collections, Tags and Library

            > **Save once. Find it when it matters.**
            > A NAS Digital Solutions product - engineered by SeifTech.

            ### What's New in Phase 3:
            - **Responsive Header & Status Bar Padding**: Applied dynamic window insets listeners for status bar & camera cutouts to ensure the app header, title, and subtitle sit comfortably below the clock and icons on every screen.
            - **Complete Collection CRUD**: Create new custom collections, rename collections, and delete collections (with safe reassignment of items back to Inbox).
            - **Collections with Live Item Counts**: Real-time item badges on every collection chip in the Library.
            - **Rich Content Detail Screen**: Tapping any card opens a dedicated bottom sheet displaying full metadata, original extracted title vs customized title, personal notes with fast inline editing, tag chips, and action shortcuts.
            - **Favorites Filtering**: Filter Library instantly by starred items with a dedicated `★ Favorites` view.
            - **Manual Tag Indexing & Filtering**: Full support for personal `#tags`, tag chips in Library, and tag editing.
            - **Title Override Protection**: Custom title editing preserves the original extracted title (`original_title`).
            - **Unit Tests**: Full test suite for URL normalization, duplicate matching, title override hierarchy, tag formatting, and collection validation.
          files: |
            release_records/phase_03_collections_library/v0.3.0/Hifadhio-v0.3.0-phase3-debug.apk
            release_records/phase_03_collections_library/v0.3.0/Hifadhio-v0.3.0-phase3-debug.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

