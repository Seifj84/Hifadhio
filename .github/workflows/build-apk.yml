name: Build Hifadhio Phase 9 APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Test APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Run Unit Tests
        run: |
          cd android
          ./gradlew testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release_records/phase_09_ocr/v0.9.0/
          cp android/app/build/outputs/apk/debug/app-debug.apk release_records/phase_09_ocr/v0.9.0/Hifadhio-v0.9.0-phase9-debug.apk
          cd release_records/phase_09_ocr/v0.9.0/
          zip -9 Hifadhio-v0.9.0-phase9-debug.zip Hifadhio-v0.9.0-phase9-debug.apk
          sha256sum Hifadhio-v0.9.0-phase9-debug.apk > SHA256SUMS.txt
          sha256sum Hifadhio-v0.9.0-phase9-debug.zip >> SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ../../..

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hifadhio-v0.9.0-phase9-debug
          path: |
            release_records/phase_09_ocr/v0.9.0/Hifadhio-v0.9.0-phase9-debug.apk
            release_records/phase_09_ocr/v0.9.0/Hifadhio-v0.9.0-phase9-debug.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.9.0-phase9
          name: "Hifadhio v0.9.0 (Phase 9: Visual Frame Extraction and OCR Engine)"
          body: |
            ## Hifadhio v0.9.0 — Phase 9 Visual Frame Extraction & OCR Engine Release

            > **Save once. Find it when it matters.**
            > A NAS Digital Solutions product - engineered by SeifTech.

            ### What's New in v0.9.0:
            - **Vendor-Neutral OCR Provider Architecture (`OcrProvider`, `OcrRegistry`)**: Extensible provider registry isolating optical character recognition engines from domain logic (Master Spec §1194).
            - **Database Schema v6 Migration (`ocr_records` table)**: Migrated SQLite database with dedicated `ocr_records` table indexing full extracted text, provider ID, model, sampled frame count, frame JSON, and cost metrics.
            - **Intelligent Text Deduplication Engine (`TextDeduplicator`)**: Suppresses persistent on-screen watermarks, static channel branding, and repeated slide headers across consecutive frames (§1195).
            - **Selective Keyframe Sampling Subsystem (`FrameExtractor`)**: Enforces intelligent periodic frame sampling policy (default 5s interval, max 15 frames) to avoid compute, battery, and storage blowups (§15.4, §1193).
            - **True Timestamps Guarantee**: Maintains true frame millisecond offsets for videos and strict `-1` for static images/infographics.
            - **On-Device Optical Character Recognition (`OnDeviceOcrProvider`, Priority 100)**: Fully local, zero-cost ($0.00) visual text extraction.
            - **Cloud Vision Integration (`CloudVisionOcrProvider`, Priority 50)**: Standard cloud vision API client abstraction with precise frame cost estimation ($0.0015/frame).
            - **Search-on-Detail in UI (`ContentDetailBottomSheet`)**: Dedicated Visual Text (OCR) card with live filtering within visual text, clickable frame timestamp chips, one-tap copy action, and manual trigger.
            - **Library-wide Visual Search**: Main library search queries inside extracted OCR visual text records so any on-screen text in saved videos or slides is immediately searchable.
            - **Background Queue Integration in `ProcessingJobManager`**: First-class `TYPE_OCR` job with automated chaining for visual media items and immutable text artifact mirroring in `media/artifacts/`.
          files: |
            release_records/phase_09_ocr/v0.9.0/Hifadhio-v0.9.0-phase9-debug.apk
            release_records/phase_09_ocr/v0.9.0/Hifadhio-v0.9.0-phase9-debug.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
