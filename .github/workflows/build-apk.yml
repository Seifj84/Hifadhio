name: Build Hifadhio Phase 7 APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Test APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Run Unit Tests
        run: |
          cd android
          ./gradlew testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release_records/phase_07_object_storage/v0.7.0/
          cp android/app/build/outputs/apk/debug/app-debug.apk release_records/phase_07_object_storage/v0.7.0/Hifadhio-v0.7.0-phase7-debug.apk
          cd release_records/phase_07_object_storage/v0.7.0/
          zip -9 Hifadhio-v0.7.0-phase7-debug.zip Hifadhio-v0.7.0-phase7-debug.apk
          sha256sum Hifadhio-v0.7.0-phase7-debug.apk > SHA256SUMS.txt
          sha256sum Hifadhio-v0.7.0-phase7-debug.zip >> SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ../../..

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hifadhio-v0.7.0-phase7-debug
          path: |
            release_records/phase_07_object_storage/v0.7.0/Hifadhio-v0.7.0-phase7-debug.apk
            release_records/phase_07_object_storage/v0.7.0/Hifadhio-v0.7.0-phase7-debug.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.7.0-phase7
          name: "Hifadhio v0.7.0 (Phase 7: Object Storage & Controlled Media Pipeline)"
          body: |
            ## Hifadhio v0.7.0 — Phase 7 Object Storage & Media Pipeline Release

            > **Save once. Find it when it matters.**
            > A NAS Digital Solutions product - engineered by SeifTech.

            ### What's New in v0.7.0:
            - **Controlled Private Object Storage (`MediaStorageManager`)**: Established partitioned internal app storage (`media/thumbnails/`, `media/temp/`, `media/audio/`, `media/artifacts/`) ensuring media is never stored as database blobs.
            - **Database Schema v4 (`artifacts` table)**: Migrated local SQLite to Schema v4 with dedicated `artifacts` tracking table indexing storage paths, content URIs, MIME types, file sizes, SHA256 checksums, retention policies, and expiration timestamps.
            - **Deterministic Naming & SHA256 Integrity**: Collision-free object naming (`item_{id}_thumb_{hash}.jpg`) and automatic SHA256 integrity verification.
            - **Automated Thumbnail Caching**: `ProcessingJobManager` automatically downloads and caches remote thumbnails upon metadata extraction for instantaneous, offline-ready display in content detail.
            - **Android FileProvider Scoped Access**: Integrated `androidx.core.content.FileProvider` (`com.seiftech.hifadhio.fileprovider`) with strict XML path mappings for secure temporary content URI access.
            - **Automated Media Cleanup Worker (`MediaCleanupWorker`)**: Periodic sweeping of expired artifacts, orphaned disk files, stale temporary processing files, and thumbnail cache quota enforcement (50 MB quota).
            - **Cascade Deletion**: Deleting content items automatically sweeps all associated media artifacts from disk and database.
            - **User Storage Controls**: Profile tab displays real-time media cache utilization and provides a one-tap "Clean Cache" maintenance action.
          files: |
            release_records/phase_07_object_storage/v0.7.0/Hifadhio-v0.7.0-phase7-debug.apk
            release_records/phase_07_object_storage/v0.7.0/Hifadhio-v0.7.0-phase7-debug.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
