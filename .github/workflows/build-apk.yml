name: Build Hifadhio Phase 5 APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Test APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Run Unit Tests
        run: |
          cd android
          ./gradlew testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release_records/phase_05_adapter_framework/v0.5.1/
          cp android/app/build/outputs/apk/debug/app-debug.apk release_records/phase_05_adapter_framework/v0.5.1/Hifadhio-v0.5.1-phase5-debug.apk
          cd release_records/phase_05_adapter_framework/v0.5.1/
          zip -9 Hifadhio-v0.5.1-phase5-debug.zip Hifadhio-v0.5.1-phase5-debug.apk
          sha256sum Hifadhio-v0.5.1-phase5-debug.apk > SHA256SUMS.txt
          sha256sum Hifadhio-v0.5.1-phase5-debug.zip >> SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ../../..

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hifadhio-v0.5.1-phase5-debug
          path: |
            release_records/phase_05_adapter_framework/v0.5.1/Hifadhio-v0.5.1-phase5-debug.apk
            release_records/phase_05_adapter_framework/v0.5.1/Hifadhio-v0.5.1-phase5-debug.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.5.1-phase5
          name: "Hifadhio v0.5.1 (Phase 5 Corrective: Facebook Adapter, HTTPS Redirects & UI Polish)"
          body: |
            ## Hifadhio v0.5.1 — Phase 5 Corrective Patch Release

            > **Save once. Find it when it matters.**
            > A NAS Digital Solutions product - engineered by SeifTech.

            ### What's Fixed in v0.5.1:
            - **Facebook Reel & Share Adapter**: Created specialized `FacebookAdapter` (Priority 80) that recognizes `facebook.com/share/r/...`, canonicalizes to `https://www.facebook.com/reel/<id>/`, and provides graceful, reliable metadata fallback preventing HTTP 400 crashes and retry loops.
            - **HTTPS Redirect Upgrade**: Patched `GenericWebAdapter` to automatically upgrade HTTP redirects to HTTPS, resolving cleartext HTTP rejections on institutional sites like `fao.org`.
            - **Scheduled Retry Execution**: Integrated `ScheduledExecutorService` into `ProcessingJobManager` ensuring retries fire precisely after backoff delay (2s, 4s, 8s, up to 60s) rather than remaining indefinitely in `RETRYING`.
            - **Separated User Status vs Developer Diagnostics**: Default UI shows simple, friendly states (`Preparing link`, `Reading page details`, `Extracting details`, `Ready`, `Could not analyze this link`, `Retrying automatically`, `Tap to retry`), while raw worker IDs, HTTP status codes, and stack traces are relegated to a collapsible Developer Diagnostics section.
            - **High-Contrast Dialog Theme**: Fixed delete confirmation dialog theme with high-contrast surfaces, readable text, and a distinct red destructive Delete action in both light and dark themes.
            - **Unit Test Coverage**: Added comprehensive test suites covering URL classification, HTTPS upgrades, Facebook canonicalization, retry backoffs, and adapter registration.
          files: |
            release_records/phase_05_adapter_framework/v0.5.1/Hifadhio-v0.5.1-phase5-debug.apk
            release_records/phase_05_adapter_framework/v0.5.1/Hifadhio-v0.5.1-phase5-debug.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
