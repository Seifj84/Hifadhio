name: Build Hifadhio Phase 2 APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Test APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Run Unit Tests
        run: |
          cd android
          ./gradlew testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release_records/phase_02_capture_triage/v0.2.0/
          cp android/app/build/outputs/apk/debug/app-debug.apk release_records/phase_02_capture_triage/v0.2.0/Hifadhio-v0.2.0-phase2-debug.apk
          cd release_records/phase_02_capture_triage/v0.2.0/
          zip -9 Hifadhio-v0.2.0-phase2-debug.zip Hifadhio-v0.2.0-phase2-debug.apk
          sha256sum Hifadhio-v0.2.0-phase2-debug.apk > SHA256SUMS.txt
          sha256sum Hifadhio-v0.2.0-phase2-debug.zip >> SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ../../..

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hifadhio-v0.2.0-phase2-debug
          path: |
            release_records/phase_02_capture_triage/v0.2.0/Hifadhio-v0.2.0-phase2-debug.apk
            release_records/phase_02_capture_triage/v0.2.0/Hifadhio-v0.2.0-phase2-debug.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0-phase2
          name: "Hifadhio v0.2.0 (Phase 2 Capture MVP & Inbox Triage)"
          body: |
            ## Hifadhio v0.2.0 — Phase 2 Capture MVP & Inbox Triage

            > **Save once. Find it when it matters.**
            > A NAS Digital Solutions product - engineered by SeifTech.

            ### What's New in Phase 2:
            - **Real-Time Duplicate Detection**: Automatically identifies previously saved links by canonical URL matching, displays a prominent duplicate banner, pre-fills previous metadata, and seamlessly updates existing records.
            - **Live Inbox Badge Counter**: Real-time counter badge on the Bottom Navigation `Inbox` tab, indicating items awaiting triage and organization.
            - **Quick "Move to Collection" Triage**: Rapidly assign items to existing collections or create new collections directly from content cards and overflow menus.
            - **Inbox Triage Header & Inbox Zero**: Visual triage progress header and celebrated "Inbox Zero" empty state when all content is neatly organized.
            - **Saved Confirmation Experience**: Material 3 confirmation snackbar with direct "View in Inbox" shortcut.
            - **Unit Tests**: Full canonical URL normalization and duplicate matching test suite.
          files: |
            release_records/phase_02_capture_triage/v0.2.0/Hifadhio-v0.2.0-phase2-debug.apk
            release_records/phase_02_capture_triage/v0.2.0/Hifadhio-v0.2.0-phase2-debug.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

