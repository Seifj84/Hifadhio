name: Build Hifadhio Phase 10 APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Test APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Run Unit Tests
        run: |
          cd android
          ./gradlew testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release_records/phase_10_ai_enrichment/v0.10.0/
          cp android/app/build/outputs/apk/debug/app-debug.apk release_records/phase_10_ai_enrichment/v0.10.0/Hifadhio-v0.10.0-phase10-debug.apk
          cd release_records/phase_10_ai_enrichment/v0.10.0/
          zip -9 Hifadhio-v0.10.0-phase10-debug.zip Hifadhio-v0.10.0-phase10-debug.apk
          sha256sum Hifadhio-v0.10.0-phase10-debug.apk > SHA256SUMS.txt
          sha256sum Hifadhio-v0.10.0-phase10-debug.zip >> SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ../../..

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hifadhio-v0.10.0-phase10-debug
          path: |
            release_records/phase_10_ai_enrichment/v0.10.0/Hifadhio-v0.10.0-phase10-debug.apk
            release_records/phase_10_ai_enrichment/v0.10.0/Hifadhio-v0.10.0-phase10-debug.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.10.0-phase10
          name: "Hifadhio v0.10.0 (Phase 10: AI Enrichment Engine)"
          body: |
            ## Hifadhio v0.10.0 — Phase 10 AI Enrichment Engine Release

            > **Save once. Find it when it matters.**
            > A NAS Digital Solutions product - engineered by SeifTech.

            ### What's New in v0.10.0:
            - **Vendor-Neutral AI Provider Architecture (`AiProvider`, `AiRegistry`)**: Modular AI enrichment engine abstraction with priority dispatch (Master Spec §1207, ADR-008).
            - **Local On-Device NLP Engine (`LocalHeuristicAiProvider`, Priority 100)**: Fully offline, $0.00 cost heuristic extraction producing concise summaries, key points, entities, suggested tags, and collection classification.
            - **Cloud LLM Abstraction (`CloudLlmAiProvider`, Priority 50)**: Standard API client abstraction with token cost tracking ($0.0005 per 1,000 chars).
            - **Strict Schema Enforcement & Validation (`PromptManager`, §18)**: Verifies structured output against strict JSON schema (`summary_short`, `summary_detailed`, `key_points`, `topics`, `suggested_tags`, `entities`, `action_items`, `suggested_collection`).
            - **Prompt Versioning & Reproducibility (`PromptManager`, §1209)**: All enrichment outputs track prompt version `v1.0.0` and can be reprocessed on demand (§1216).
            - **Database Schema v7 Migration (`ai_enrichments` table)**: Persistent SQLite Schema v7 with cascade deletion on item removal and foreign key index.
            - **Library-wide Search Integration**: Main search bar matches query keywords directly within AI short summaries, detailed summaries, and raw JSON payloads (§16.2).
            - **Immutable Artifact Mirroring**: Saves validated enrichment payloads to `media/artifacts/item_{id}_ai_{hash}.json` with SHA256 integrity hashing (§1196).
            - **Background Queue Integration (`TYPE_AI_ENRICHMENT`)**: Asynchronous pipeline job in `ProcessingJobManager` auto-chaining after metadata/transcription/OCR jobs.
            - **Interactive AI UI in `ContentDetailBottomSheet`**: Dedicated AI Enrichment card with "AI GENERATED" label (§790), expandable summaries, key takeaways, entities mentioned, clickable suggested tags (tap to add to item), suggested collection (tap to move), copy summary action, and reprocess button.
          files: |
            release_records/phase_10_ai_enrichment/v0.10.0/Hifadhio-v0.10.0-phase10-debug.apk
            release_records/phase_10_ai_enrichment/v0.10.0/Hifadhio-v0.10.0-phase10-debug.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
