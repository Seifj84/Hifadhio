name: Build Hifadhio Phase 8 APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Test APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Run Unit Tests
        run: |
          cd android
          ./gradlew testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release_records/phase_08_transcription/v0.8.0/
          cp android/app/build/outputs/apk/debug/app-debug.apk release_records/phase_08_transcription/v0.8.0/Hifadhio-v0.8.0-phase8-debug.apk
          cd release_records/phase_08_transcription/v0.8.0/
          zip -9 Hifadhio-v0.8.0-phase8-debug.zip Hifadhio-v0.8.0-phase8-debug.apk
          sha256sum Hifadhio-v0.8.0-phase8-debug.apk > SHA256SUMS.txt
          sha256sum Hifadhio-v0.8.0-phase8-debug.zip >> SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ../../..

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hifadhio-v0.8.0-phase8-debug
          path: |
            release_records/phase_08_transcription/v0.8.0/Hifadhio-v0.8.0-phase8-debug.apk
            release_records/phase_08_transcription/v0.8.0/Hifadhio-v0.8.0-phase8-debug.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.8.0-phase8
          name: "Hifadhio v0.8.0 (Phase 8: Audio Extraction & Transcription Pipeline)"
          body: |
            ## Hifadhio v0.8.0 — Phase 8 Audio Extraction & Transcription Pipeline Release

            > **Save once. Find it when it matters.**
            > A NAS Digital Solutions product - engineered by SeifTech.

            ### What's New in v0.8.0:
            - **Vendor-Neutral Transcription Provider Architecture (`TranscriptionProvider`, `TranscriptionRegistry`)**: Extensible provider registry isolating transcription vendors from domain logic (Master Spec ADR-007).
            - **Database Schema v5 Migration (`transcripts` table)**: Migrated SQLite database with dedicated `transcripts` table indexing full text, detected language, provider ID, model, duration, segments JSON, confidence, and cost metrics.
            - **True Timestamps Guarantee**: Adheres strictly to Master Spec §15.3 ("Never fabricate timestamps") - timestamps are recorded only when genuinely returned by subtitle or speech providers.
            - **Native Subtitle & Caption Extractor (`SubtitlesExtractorProvider`, Priority 100)**: Zero-cost ($0.00) deterministic parser for WebVTT and SubRip (SRT) tracks with milli-precision timecodes and XML tag stripping.
            - **On-Device Offline Speech Engine (`OfflineSpeechProvider`, Priority 80)**: Complete offline transcription capability respecting file duration and 25 MB file size quotas.
            - **Cloud Whisper API Client (`CloudWhisperProvider`, Priority 50)**: OpenAI/Groq compliant Whisper integration with multipart streaming and exact duration/cost tracking ($0.006/min).
            - **Audio Extraction & Lifecycle Subsystem (`AudioExtractor`)**: Validates audio format, size (<25 MB), and duration (<30 min), managing scratchpad files in `media/audio/`.
            - **Automated Pipeline Chaining in `ProcessingJobManager`**: Automatically enqueues and runs transcription for video/audio items (YouTube, TikTok, Instagram Reels, Facebook Reels) upon metadata extraction.
            - **Search-on-Detail in UI (`ContentDetailBottomSheet`)**: Live filtering and segment search within transcripts, clickable timestamp chips, one-tap copy transcript action, and manual transcribe trigger.
            - **Library-wide Transcript Search**: Database search now queries inside extracted transcripts so any spoken phrase in a saved video is immediately retrievable.
          files: |
            release_records/phase_08_transcription/v0.8.0/Hifadhio-v0.8.0-phase8-debug.apk
            release_records/phase_08_transcription/v0.8.0/Hifadhio-v0.8.0-phase8-debug.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
