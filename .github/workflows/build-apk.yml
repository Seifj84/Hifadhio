name: Build Hifadhio Phase 4 APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Test APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Run Unit Tests
        run: |
          cd android
          ./gradlew testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release_records/phase_04_processing_framework/v0.4.0/
          cp android/app/build/outputs/apk/debug/app-debug.apk release_records/phase_04_processing_framework/v0.4.0/Hifadhio-v0.4.0-phase4-debug.apk
          cd release_records/phase_04_processing_framework/v0.4.0/
          zip -9 Hifadhio-v0.4.0-phase4-debug.zip Hifadhio-v0.4.0-phase4-debug.apk
          sha256sum Hifadhio-v0.4.0-phase4-debug.apk > SHA256SUMS.txt
          sha256sum Hifadhio-v0.4.0-phase4-debug.zip >> SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ../../..

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hifadhio-v0.4.0-phase4-debug
          path: |
            release_records/phase_04_processing_framework/v0.4.0/Hifadhio-v0.4.0-phase4-debug.apk
            release_records/phase_04_processing_framework/v0.4.0/Hifadhio-v0.4.0-phase4-debug.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.4.0-phase4
          name: "Hifadhio v0.4.0 (Phase 4 Processing Job Framework)"
          body: |
            ## Hifadhio v0.4.0 — Phase 4 Processing Job Framework

            > **Save once. Find it when it matters.**
            > A NAS Digital Solutions product - engineered by SeifTech.

            ### What's New in Phase 4:
            - **Asynchronous Processing Pipeline**: Decoupled link capture from background content extraction via SQLite database schema v3.
            - **Processing Jobs (`processing_jobs`)**: Persisted job queue with state transitions (`QUEUED`, `CLAIMED`, `RUNNING`, `RETRYING`, `COMPLETED`, `FAILED`, `CANCELLED`).
            - **Worker Claim & Lease Locking**: Atomic worker claims with configurable lease durations and heartbeat renewal preventing multi-worker race conditions.
            - **Stale Job Recovery**: Interrupted, abandoned, or crashed worker jobs automatically recover back to `QUEUED` when leases expire.
            - **Exponential Backoff & Retry**: Failed network or parsing jobs automatically retry with exponential backoff up to `max_attempts = 3`.
            - **Idempotency Key Guarantees**: Prevents duplicate job execution for identical items.
            - **Audit Events Timeline (`processing_events`)**: Append-only log tracking every stage transition and progress milestone.
            - **UI Real-Time Status & Retry Action**: Content cards and Content Detail sheets display live processing indicators, progress status, and a one-tap "Retry Processing" button for failed jobs.
            - **Comprehensive Test Suite**: Unit tests verifying worker lease, exponential backoff, idempotency, stale recovery, and cancellation.
          files: |
            release_records/phase_04_processing_framework/v0.4.0/Hifadhio-v0.4.0-phase4-debug.apk
            release_records/phase_04_processing_framework/v0.4.0/Hifadhio-v0.4.0-phase4-debug.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
