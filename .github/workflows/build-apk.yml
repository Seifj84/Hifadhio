name: Build Hifadhio Phase 5 APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Test APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Run Unit Tests
        run: |
          cd android
          ./gradlew testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release_records/phase_05_adapter_framework/v0.5.0/
          cp android/app/build/outputs/apk/debug/app-debug.apk release_records/phase_05_adapter_framework/v0.5.0/Hifadhio-v0.5.0-phase5-debug.apk
          cd release_records/phase_05_adapter_framework/v0.5.0/
          zip -9 Hifadhio-v0.5.0-phase5-debug.zip Hifadhio-v0.5.0-phase5-debug.apk
          sha256sum Hifadhio-v0.5.0-phase5-debug.apk > SHA256SUMS.txt
          sha256sum Hifadhio-v0.5.0-phase5-debug.zip >> SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ../../..

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hifadhio-v0.5.0-phase5-debug
          path: |
            release_records/phase_05_adapter_framework/v0.5.0/Hifadhio-v0.5.0-phase5-debug.apk
            release_records/phase_05_adapter_framework/v0.5.0/Hifadhio-v0.5.0-phase5-debug.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.5.0-phase5
          name: "Hifadhio v0.5.0 (Phase 5 Adapter Framework & Generic Web Metadata)"
          body: |
            ## Hifadhio v0.5.0 — Phase 5 Adapter Framework & Generic Web Metadata

            > **Save once. Find it when it matters.**
            > A NAS Digital Solutions product - engineered by SeifTech.

            ### What's New in Phase 5:
            - **Extensible Adapter Framework**: Standardized `ContentExtractorAdapter` interface separating platform extraction logic from core database domain.
            - **ContentAdapterRegistry**: Priority-based singleton registry supporting dynamic platform adapter registration and adapter health checks.
            - **GenericWebAdapter**: Universal web metadata extractor supporting OpenGraph tags (`og:title`, `og:description`, `og:image`, `og:site_name`, `og:type`), Twitter cards, and standard HTML `<title>`, `<meta name="description">`, and `<link rel="canonical">`.
            - **HTML Entity Decoding & Relative URL Resolution**: Automatically decodes HTML entities (`&amp;`, `&#39;`, `&quot;`, `&mdash;`) and resolves relative thumbnail/canonical URLs against the base domain.
            - **Automated Processing Pipeline Integration**: `ProcessingJobManager` connects directly to the adapter registry, populating real titles, extracted captions, and high-resolution thumbnail URLs into `ContentDb`.
            - **Rich Metadata Display**: Content cards and Content Detail sheets now surface extracted descriptions and original extracted titles.
            - **Unit Test Coverage**: Comprehensive test suites for `AdapterRegistryTest` (registration, priority routing, fallback) and `GenericWebAdapterTest` (OpenGraph extraction, attribute ordering variations, HTML fallback, entity decoding).
          files: |
            release_records/phase_05_adapter_framework/v0.5.0/Hifadhio-v0.5.0-phase5-debug.apk
            release_records/phase_05_adapter_framework/v0.5.0/Hifadhio-v0.5.0-phase5-debug.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
